name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, logs, and expected behavior. Remove private URLs.
    validations:
      required: true
  - type: input
    attributes:
      label: Version and platform
      placeholder: "0.1.0, Python 3.11, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Dependency check
      description: Paste the output of `youtube-clipper --check`.
