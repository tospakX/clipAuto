[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-youtube-clipper"
dynamic = ["version"]
description = "Turn a multi-topic YouTube video into local short-form clips."
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["youtube", "video", "shorts", "tiktok", "reels", "whisper", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "faster-whisper>=1.1,<2",
  "scenedetect[opencv]>=0.6.4,<0.7",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
youtube-clipper = "youtube_clipper.cli:main"

[tool.setuptools.packages.find]
include = ["youtube_clipper*"]

[tool.setuptools.dynamic]
version = {attr = "youtube_clipper.__version__"}

[tool.setuptools.package-data]
"youtube_clipper.ui" = ["*.html", "*.css", "*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
